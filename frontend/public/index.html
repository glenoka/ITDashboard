<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#0F172A',
              card: '#1E293B',
              border: '#334155',
              accent: '#22C55E',
              danger: '#EF4444',
              warning: '#F59E0B',
              info: '#38BDF8',
              muted: '#64748B',
              text: '#E2E8F0',
            },
            fontFamily: {
              mono: ['JetBrains Mono', 'monospace'],
              display: ['Syne', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-bg text-text font-mono">
    <div id="root"></div>
  </body>
</html>
